<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box;user-select:none}
  html,body{background:transparent;overflow:hidden}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-app-region:drag}
  .card{background:rgba(20,20,19,.95);backdrop-filter:blur(20px);border:.5px solid rgba(255,255,255,.14);border-radius:14px;padding:14px 16px;color:#f5f5f0;height:100vh;display:flex;flex-direction:column;gap:8px;box-shadow:0 10px 40px rgba(0,0,0,.4)}
  .title{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#898781}
  select,input{-webkit-app-region:no-drag;width:100%;padding:8px 10px;font-size:13px;border-radius:8px;border:.5px solid rgba(255,255,255,.18);background:#262624;color:#f5f5f0;outline:none}
  input:focus,select:focus{border-color:#3b82f6}
  .btns{display:flex;gap:8px;margin-top:2px}
  button{-webkit-app-region:no-drag;flex:1;padding:8px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:.5px solid rgba(255,255,255,.18);background:transparent;color:#f5f5f0}
  button.add{background:#3b82f6;border-color:#3b82f6;color:#fff}
  button.add:hover{background:#2563eb}
  button:not(.add):hover{background:rgba(255,255,255,.08)}
</style>
</head>
<body>
<div class="card">
  <div class="title">Quick Add — Today's P&amp;L</div>
  <select id="qAcc"></select>
  <input type="number" id="qPnl" placeholder="+450 or -150" step="0.01" autofocus>
  <div class="btns">
    <button onclick="patienceQuickAdd.close()">Cancel</button>
    <button class="add" onclick="submit()">Add</button>
  </div>
</div>
<script>
  patienceQuickAdd.onAccounts(list=>{
    const sel=document.getElementById('qAcc');
    sel.innerHTML=(list||[]).map(a=>'<option value="'+a.id+'">'+a.name+' ('+a.status+')</option>').join('')||'<option value="">No accounts</option>';
  });
  function submit(){
    const acc=document.getElementById('qAcc').value;
    const pnl=parseFloat(document.getElementById('qPnl').value);
    if(!acc||!pnl)return;
    patienceQuickAdd.submit(acc,pnl);
  }
  document.addEventListener('keydown',e=>{
    if(e.key==='Enter')submit();
    else if(e.key==='Escape')patienceQuickAdd.close();
  });
  setTimeout(()=>document.getElementById('qPnl').focus(),100);
</script>
</body>
</html>
